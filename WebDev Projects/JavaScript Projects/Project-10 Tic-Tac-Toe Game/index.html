<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic Tac Toe Game</title>
    <link rel="stylesheet" href="output.css">
    <link rel="shortcut icon" href="https://cdn-icons-png.flaticon.com/128/14363/14363125.png" type="image/x-icon">
</head>
<body class="h-screen w-screen bg-[#212121] text-white flex flex-col justify-center items-center">
    <h1 class="text-3xl font-medium mb-3">Tic Tac Toe</h1>
    <div class="ticTac grid grid-cols-3 gap-1.25">
        <div class="box h-25 w-25 bg-white text-black rounded-sm text-5xl flex justify-center items-center cursor-pointer"></div>
        <div class="box h-25 w-25 bg-white text-black rounded-sm text-5xl flex justify-center items-center cursor-pointer"></div>
        <div class="box h-25 w-25 bg-white text-black rounded-sm text-5xl flex justify-center items-center cursor-pointer"></div>
        <div class="box h-25 w-25 bg-white text-black rounded-sm text-5xl flex justify-center items-center cursor-pointer"></div>
        <div class="box h-25 w-25 bg-white text-black rounded-sm text-5xl flex justify-center items-center cursor-pointer"></div>
        <div class="box h-25 w-25 bg-white text-black rounded-sm text-5xl flex justify-center items-center cursor-pointer"></div>
        <div class="box h-25 w-25 bg-white text-black rounded-sm text-5xl flex justify-center items-center cursor-pointer"></div>
        <div class="box h-25 w-25 bg-white text-black rounded-sm text-5xl flex justify-center items-center cursor-pointer"></div>
        <div class="box h-25 w-25 bg-white text-black rounded-sm text-5xl flex justify-center items-center cursor-pointer"></div>
    </div>
    <button id="restart-btn" class="border px-3 py-1 mt-3 cursor-pointer text-black bg-yellow-500 hover:bg-amber-300 rounded-md">Restart</button>


    <script src="index.js"></script>
</body>
</html>
