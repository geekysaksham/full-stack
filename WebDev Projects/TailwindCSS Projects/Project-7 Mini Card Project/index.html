<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini Card Project</title>
    <link rel="stylesheet" href="output.css">
</head>
<body>
    <div class="wrapper bg-[url(https://img.magnific.com/free-vector/watercolor-soft-earth-tones-background_23-2151155668.jpg?semt=ais_hybrid&w=740&q=80)] bg-cover w-screen h-screen flex justify-center items-center">

        <div class="card h-7/12 w-80 flex flex-col justify-between p-2 rounded-xl bg-white items-start border-3 border-red-500">
            <div class="cardImg overflow-hidden border-2 border-green-600 rounded-lg"><img class="rounded-lg hover:scale-110 duration-500" src="https://www.pelago.com/img/collections/varanasi/0527-0907_varanasi.jpg" alt="varanasi"></div>
            <p class="font-medium italic">Varanasi, also commonly known as Banaras or Kashi, is a historic city situated on the banks of the Ganges River in the northern Indian state of Uttar Pradesh. It is widely celebrated as the spiritual capital of India.</p>
            <button class="bg-amber-300 p-2 hover:bg-green-400 hover:duration-500 rounded-md">Read More</button>
        </div>
    </div>
</body>
</html>
